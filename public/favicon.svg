<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="16" fill="#070F1C"/>
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#B8882A" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#B8882A" stroke-width="0.4" opacity="0.5"/>
  <!-- Heraldic rampant lion — simplified but recognizable gold silhouette -->
  <g fill="#B8882A" transform="translate(16,17) scale(0.6)">
    <!-- Body -->
    <ellipse cx="0" cy="4" rx="5" ry="8"/>
    <!-- Head -->
    <circle cx="4" cy="-8" r="5.5"/>
    <!-- Mane ring -->
    <circle cx="4" cy="-8" r="7" fill="none" stroke="#B8882A" stroke-width="2.2"/>
    <!-- Tail -->
    <path d="M8,6 C14,0 16,-8 12,-12 C10,-14 8,-12 9,-10 C10,-8 12,-10 11,-12" fill="none" stroke="#B8882A" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Left forepaw raised -->
    <ellipse cx="-6" cy="-2" rx="4" ry="2.5" transform="rotate(-40 -6 -2)"/>
    <!-- Right forepaw -->
    <ellipse cx="10" cy="0" rx="4" ry="2.5" transform="rotate(20 10 0)"/>
    <!-- Hindlegs -->
    <ellipse cx="-3" cy="13" rx="3" ry="2" transform="rotate(15 -3 13)"/>
    <ellipse cx="3" cy="13" rx="3" ry="2" transform="rotate(-15 3 13)"/>
  </g>
  <!-- Side dots -->
  <circle cx="1.8" cy="16" r="1" fill="#B8882A" opacity="0.7"/>
  <circle cx="30.2" cy="16" r="1" fill="#B8882A" opacity="0.7"/>
</svg>
